<path id="p0" d="M130 120 L240 120 L240 230" fill="none" stroke="#FFC933" stroke-width="2.5" class="flow"/>
<circle r="5" fill="#FFFFFF"><animateMotion dur="3s" begin="0.0s" repeatCount="indefinite"><mpath href="#p0"/></animateMotion></circle>
<text class="m" x="185" y="110" font-size="12" fill="#FFC933" text-anchor="middle" font-weight="400" opacity="1">1.4 km</text>
