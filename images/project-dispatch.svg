<circle class="ring" cx="560" cy="215" r="20" fill="none" stroke="#FF6A55" stroke-width="2"/><circle cx="560" cy="215" r="10" fill="#FF6A55"/><circle cx="560" cy="215" r="3.5" fill="#FFFFFF"/>
<circle class="ring" cx="370" cy="395" r="20" fill="none" stroke="#FF6A55" stroke-width="2"/><circle cx="370" cy="395" r="10" fill="#FF6A55"/><circle cx="370" cy="395" r="3.5" fill="#FFFFFF"/>
<rect x="584" y="318" width="190" height="162" rx="12" fill="#000" fill-opacity=".35" stroke="#FFFFFF" stroke-opacity=".2"/><text class="m" x="602" y="342" font-size="12" fill="#FFFFFF" text-anchor="start" font-weight="400" opacity="0.7">min-heap of distances</text>
<line x1="679" y1="376" x2="636" y2="420" stroke="#FFFFFF" stroke-opacity=".4" stroke-width="1.5"/>
<line x1="679" y1="376" x2="722" y2="420" stroke="#FFFFFF" stroke-opacity=".4" stroke-width="1.5"/>
