<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Real-time delivery matching and dispatch</title><desc id="d">A city map where each delivery order is matched to its nearest driver by distance, with a min-heap of candidate distances.</desc>
<defs>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#FFFFFF" opacity="0.14"/></pattern>
<style>
.m{font-family:'JetBrains Mono','IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out infinite}
@keyframes ring{from{transform:scale(.35);opacity:.95}to{transform:scale(1.7);opacity:0}}
.flow{stroke-dasharray:6 6;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-24}}
.blink{animation:blink 1.6s steps(2,jump-none) infinite}
@keyframes blink{50%{opacity:.25}}
.bob{animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.wave{animation:wave 1.8s ease-out infinite}
@keyframes wave{from{opacity:.9}to{opacity:0}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.grow{transform-box:fill-box;transform-origin:bottom;animation:grow 3.2s ease-in-out infinite alternate}
@keyframes grow{from{transform:scaleY(.7)}to{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){.ring,.flow,.blink,.bob,.wave,.spin,.grow{animation:none}}
</style>
</defs>
<rect width="800" height="500" rx="18" fill="#0A1A3F"/>
<rect width="800" height="500" rx="18" fill="url(#dots)"/>
<line x1="0" y1="0" x2="0" y2="500" stroke="#DCE5FF" stroke-opacity=".07"/>
<line x1="50" y1="0" x2="50" y2="500" stroke="#DCE5FF" stroke-opacity=".07"/>
<line x1="100" y1="0" x2="100" y2="500" stroke="#DCE5FF" stroke-opacity=".07"/>
<line x1="150" y1="0" x2="150" y2="500" stroke="#DCE5FF" stroke-opacity=".07"/>
<line x1="200" y1="0" x2="200" y2="500" stroke="#DCE5FF" stroke-opacity=".07"/>
<line x1="250" y1="0" x2="250" y2="500" stroke="#DCE5FF" stroke-opacity=".07"/>
<line x1="300" y1="0" x2="300" y2="500" stroke="#DCE5FF" stroke-opacity=".07"/>
