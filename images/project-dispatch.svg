<circle cx="636" cy="420" r="15" fill="#2442D6" stroke="#FFFFFF" stroke-opacity=".5"/><text class="m" x="636" y="424" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="400" opacity="1">1.1</text>
<circle cx="722" cy="420" r="15" fill="#2442D6" stroke="#FFFFFF" stroke-opacity=".5"/><text class="m" x="722" y="424" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="400" opacity="1">1.4</text>
<circle cx="612" cy="462" r="15" fill="#2442D6" stroke="#FFFFFF" stroke-opacity=".5"/><text class="m" x="612" y="466" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="400" opacity="1">2.0</text>
