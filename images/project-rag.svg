<title id="t">Retrieval-augmented chatbot</title><desc id="d">A question is embedded, matched to the three nearest document vectors, and those documents ground the answer.</desc>
<defs>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#FFFFFF" opacity="0.14"/></pattern>
<style>
.m{font-family:'JetBrains Mono','IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out infinite}
@keyframes ring{from{transform:scale(.35);opacity:.95}to{transform:scale(1.7);opacity:0}}
.flow{stroke-dasharray:6 6;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-24}}
.blink{animation:blink 1.6s steps(2,jump-none) infinite}
@keyframes blink{50%{opacity:.25}}
.bob{animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.wave{animation:wave 1.8s ease-out infinite}
@keyframes wave{from{opacity:.9}to{opacity:0}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.grow{transform-box:fill-box;transform-origin:bottom;animation:grow 3.2s ease-in-out infinite alternate}
@keyframes grow{from{transform:scaleY(.7)}to{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){.ring,.flow,.blink,.bob,.wave,.spin,.grow{animation:none}}
</style>
</defs>
